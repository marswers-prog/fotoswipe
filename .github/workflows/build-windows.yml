name: FotoSwipe fuer Windows bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Windows/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

concurrency:
  group: fotoswipe-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows-Programm bauen und testen
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Python fuer Windows bereitstellen
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: Windows/requirements.txt

      - name: Abhaengigkeiten installieren
        run: python -m pip install --disable-pip-version-check -r Windows/requirements.txt

      - name: Dateioperationen und Fortschritt testen
        env:
          PYTHONPATH: Windows
        run: python -m unittest discover -s Windows/tests -v

      - name: Symbol und Lizenztexte vorbereiten
        run: python Windows/build_assets.py

      - name: Eigenstaendige EXE erstellen
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name FotoSwipe --icon Windows/build/app.ico
          --add-data "Windows/build/app.ico;assets"
          --collect-all pillow_heif
          --hidden-import send2trash.win.modern --hidden-import win32timezone
          --paths Windows --distpath Windows/dist
          --workpath Windows/build/pyinstaller --specpath Windows/build
          Windows/main.py

      - name: Gepacktes Windows-Programm pruefen
        shell: pwsh
        run: |
          $resultFile = Join-Path $pwd 'Windows/build/smoke.json'
          $process = Start-Process -FilePath 'Windows/dist/FotoSwipe.exe' -ArgumentList @('--self-test-result', $resultFile) -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Desktop-Pruefung hat das Zeitlimit erreicht.'
          }
          if (Test-Path $resultFile) { Get-Content $resultFile }
          if ($process.ExitCode -ne 0) { throw 'Das gepackte Programm hat die Pruefung nicht bestanden.' }
          $result = Get-Content $resultFile -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw $result.error }

      - name: Download-Paket zusammenstellen
        shell: pwsh
        run: |
          $package = 'Windows/package/FotoSwipe-Windows'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item 'Windows/dist/FotoSwipe.exe' $package
          Copy-Item 'Windows/ANLEITUNG.txt' $package
          Copy-Item 'Windows/DRITTANBIETER.txt' $package
          Copy-Item 'Windows/build/licenses' "$package/Lizenzen" -Recurse
          Compress-Archive -Path $package -DestinationPath 'Windows/package/FotoSwipe-Windows.zip'

      - name: Windows-Download bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: FotoSwipe-Windows-10-64bit
          path: Windows/package/FotoSwipe-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Pruefbericht bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FotoSwipe-Windows-Pruefbericht
          path: |
            Windows/build/smoke.json
            Windows/build/pyinstaller/FotoSwipe/warn-FotoSwipe.txt
          if-no-files-found: ignore
          retention-days: 7
